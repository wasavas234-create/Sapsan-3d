<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>САПСАН 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101d2b;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.panel{background:#071521dd;padding:12px;border-radius:12px;font-size:14px}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-around;z-index:3}
button{border:1px solid #ffffff55;background:#1268a8;color:white;border-radius:15px;padding:17px;font-size:22px;touch-action:none}
#overlay{position:fixed;inset:0;background:#061321ed;display:grid;place-items:center;text-align:center;z-index:5;padding:20px}
#overlay button{font-size:20px;padding:17px 35px}
#help{font-size:13px;color:#b7d0e6;line-height:1.6}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">🦅 САПСАН 3D<br>Скорость: <span id="speed">180</span> км/ч</div>
 <div class="panel">Очки: <span id="score">0</span></div>
</div>

<div id="overlay">
 <div>
  <h1>🦅 САПСАН 3D</h1>
  <h3>Высокоскоростное испытание</h3>
  <p id="help">Летай рядом с поездом, собирай кольца<br>и устанавливай рекорды.</p>
  <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
 </div>
</div>

<div id="controls">
 <button id="left">◀</button>
 <button id="up">▲</button>
 <button id="down">▼</button>
 <button id="right">▶</button>
 <button id="sound">🔊</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b8d9);
scene.fog=new THREE.Fog(0x91b8d9,35,180);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
camera.position.set(0,5,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2));
const sunlight=new THREE.DirectionalLight(0xffffff,2.3);
sunlight.position.set(15,30,10);
sunlight.castShadow=true;
scene.add(sunlight);

// Земля
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x52734b})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-2;
scene.add(ground);

// Рельсы
const railMat=new THREE.MeshStandardMaterial({color:0x444b53,metalness:.7});
for(const x of [-2,2]){
 const rail=new THREE.Mesh(new THREE.BoxGeometry(.14,.17,300),railMat);
 rail.position.set(x,-1.65,-100);
 scene.add(rail);
}

// Шпалы
const sleepers=[];
for(let z=10;z>-200;z-=2){
 const s=new THREE.Mesh(
  new THREE.BoxGeometry(5,.15,.4),
  new THREE.MeshStandardMaterial({color:0x51402f})
 );
 s.position.set(0,-1.76,z);
 scene.add(s);
 sleepers.push(s);
}

// Поезд
const train=new THREE.Group();
const white=new THREE.MeshStandardMaterial({color:0xe7ebef,roughness:.3});
const blue=new THREE.MeshStandardMaterial({color:0x164e9c,metalness:.4});

const body=new THREE.Mesh(new THREE.BoxGeometry(3,3,16),white);
train.add(body);

const stripe=new THREE.Mesh(new THREE.BoxGeometry(3.04,.45,16.1),blue);
stripe.position.y=-.55;
train.add(stripe);

const nose=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,4),white);
nose.rotation.x=Math.PI/2;
nose.position.set(0,.1,-10);
train.add(nose);

for(let i=0;i<8;i++){
 const window=new THREE.Mesh(
  new THREE.BoxGeometry(.04,.65,1.3),
  new THREE.MeshStandardMaterial({color:0x172d46,metalness:.7})
 );
 window.position.set(1.52,.65,-6+i*1.7);
 train.add(window);
}
train.position.set(-7,0,-20);
scene.add(train);

// Птица
const bird=new THREE.Group();
const dark=new THREE.MeshStandardMaterial({color:0x303a43,roughness:.8});
const light=new THREE.MeshStandardMaterial({color:0xe1d9c8});

const torso=new THREE.Mesh(new THREE.SphereGeometry(.65,24,20),dark);
torso.scale.set(.7,.8,1.6);
bird.add(torso);

const belly=new THREE.Mesh(new THREE.SphereGeometry(.5,20,16),light);
belly.scale.set(.8,.8,.8);
belly.position.set(0,-.2,-.4);
bird.add(belly);

const head=new THREE.Mesh(new THREE.SphereGeometry(.43,20,16),dark);
head.position.set(0,.35,-.9);
bird.add(head);

const beak=new THREE.Mesh(
 new THREE.ConeGeometry(.16,.5,5),
 new THREE.MeshStandardMaterial({color:0xe4ae45})
);
beak.rotation.x=-Math.PI/2;
beak.position.set(0,.25,-1.4);
bird.add(beak);

const wings=[];
for(const side of [-1,1]){
 const pivot=new THREE.Group();
 pivot.position.set(side*.35,.15,0);
 const wing=new THREE.Mesh(new THREE.BoxGeometry(3,.12,1.6),dark);
 wing.position.x=side*1.3;
 pivot.add(wing);
 bird.add(pivot);
 wings.push(pivot);
}
bird.position.set(0,1,3);
scene.add(bird);

// Контрольные кольца
const rings=[];
for(let i=0;i<12;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(2,.09,10,40),
  new THREE.MeshStandardMaterial({
   color:0xffd447,emissive:0x624100
  })
 );
 ring.position.set((Math.random()-.5)*8,1,-20-i*22);
 scene.add(ring);
 rings.push(ring);
}

// Игровая логика
let running=false;
let score=0;
let speed=180;
let x=0,y=1;
let keys={};
let audio=null,engine=null,mute=false;
let last=0;

function bind(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}
bind('left','left');
bind('right','right');
bind('up','up');
bind('down','down');

window.addEventListener('keydown',e=>{
 keys[e.key]=true;
});
window.addEventListener('keyup',e=>{
 keys[e.key]=false;
});

function startGame(){
 if(!window.THREE)return;
 document.getElementById('overlay').style.display='none';
 if(!audio){
  audio=new AudioContext();
  engine=audio.createOscillator();
  const gain=audio.createGain();
  engine.type='sawtooth';
  engine.frequency.value=100;
  gain.gain.value=.018;
  engine.connect(gain);
  gain.connect(audio.destination);
  engine.start();
 }else audio.resume();

 running=true;
 last=performance.now();
 animate();
}

document.getElementById('sound').onclick=()=>{
 mute=!mute;
 if(audio)audio.suspend();
 if(!mute&&audio)audio.resume();
 document.getElementById('sound').textContent=mute?'🔇':'🔊';
};

function animate(){
 if(!running)return;
 requestAnimationFrame(animate);

 const now=performance.now();
 const dt=Math.min((now-last)/16.67,2);
 last=now;

 if(keys.left||keys.ArrowLeft||keys.a)x-=.12*dt;
 if(keys.right||keys.ArrowRight||keys.d)x+=.12*dt;
 if(keys.up||keys.ArrowUp||keys.w)y+=.09*dt;
 if(keys.down||keys.ArrowDown||keys.s)y-=.09*dt;

 x=Math.max(-5,Math.min(5,x));
 y=Math.max(-1,Math.min(5,y));

 bird.position.x+=(x-bird.position.x)*.12*dt;
 bird.position.y+=(y-bird.position.y)*.12*dt;

 bird.rotation.z=(bird.position.x-x)*.12;
 bird.rotation.x=(1-y)*.04;

 const t=now*.006;
 wings[0].rotation.z=Math.sin(t)*.38;
 wings[1].rotation.z=-Math.sin(t)*.38;

 camera.position.x+=(bird.position.x*.35-camera.position.x)*.04;
 camera.position.y+=(bird.position.y+4-camera.position.y)*.04;
 camera.lookAt(bird.position.x,0,-10);

 const movement=.65+speed/350;

 sleepers.forEach(s=>{
  s.position.z+=movement*dt;
  if(s.position.z>10)s.position.z-=300;
 });

 rings.forEach(r=>{
  r.position.z+=movement*dt;
  if(r.position.z>8){
   r.position.z-=264;
   r.position.x=(Math.random()-.5)*9;
   r.position.y=Math.random()*4;
  }

  const distance=Math.hypot(
   r.position.x-bird.position.x,
   r.position.y-bird.position.y
  );

  if(Math.abs(r.position.z-bird.position.z)<1.5&&distance<1.8){
   score+=10;
   document.getElementById('score').textContent=score;
   r.position.z=-250;
  }
 });

 train.position.z+=movement*.3*dt;
 if(train.position.z>25)train.position.z=-150;

 speed=Math.min(350,speed+.015*dt);
 document.getElementById('speed').textContent=Math.round(speed);

 if(engine)engine.frequency.value=65+speed*.3;

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
